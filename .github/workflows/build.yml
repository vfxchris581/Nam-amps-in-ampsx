name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb ninja-build

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" == "Linux" ]; then EXTRA="-G Ninja -DNAMKNOBS_BUILD_SCREENSHOT=ON"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Check macOS binaries are universal (Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          ART="build/Source/Plugin/NamKnobs_artefacts/Release"
          for b in "$ART/VST3/Nam Knobs.vst3/Contents/MacOS/Nam Knobs" \
                   "$ART/AU/Nam Knobs.component/Contents/MacOS/Nam Knobs" \
                   "$ART/Standalone/Nam Knobs.app/Contents/MacOS/Nam Knobs"; do
            archs="$(lipo -archs "$b")"
            minos="$(vtool -show-build "$b" 2>/dev/null | awk '/minos/ {print $2; exit}')"
            echo "$(basename "$(dirname "$(dirname "$(dirname "$b")")")"): $archs (macOS $minos+)"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::$b is not universal ($archs)"; exit 1 ;; esac
          done

      - name: UI screenshots
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24" \
            build/Source/Plugin/NamKnobsScreenshot_artefacts/Release/NamKnobsScreenshot screenshots

      # Optional: add these repository secrets to ship a signed + notarised installer.
      # Without them the installer is built unsigned (macOS asks you to allow it once).
      - name: Import signing certificates
        if: runner.os == 'macOS'
        env:
          MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTS_P12" ]; then echo "No signing certificates - building an unsigned installer"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$KC" -P "$MACOS_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Package macOS installer (DMG)
        if: runner.os == 'macOS'
        env:
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash BuildScripts/make_dmg.sh build

      - name: Package Windows (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $art = "build/Source/Plugin/NamKnobs_artefacts/Release"
          New-Item -ItemType Directory -Force -Path dist/NamKnobs | Out-Null
          Copy-Item -Recurse "$art/VST3/Nam Knobs.vst3" dist/NamKnobs/
          Copy-Item "$art/Standalone/Nam Knobs.exe" dist/NamKnobs/
          Copy-Item Documentation/INSTALL.md dist/NamKnobs/
          Compress-Archive -Path dist/NamKnobs/* -DestinationPath dist/NamKnobs-Windows.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: NamKnobs-macOS
          path: dist/*.dmg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: NamKnobs-Windows
          path: dist/NamKnobs-Windows.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: NamKnobs-screenshots
          path: screenshots/*.png
